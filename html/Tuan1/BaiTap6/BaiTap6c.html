<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            border: 1px solid black;
            width: 200px;
        }
        
        input[type="button"] {
            margin: 10px;
            margin-left: 40px;
        }
    </style>
</head>

<body>
    <form>
        <table>
            <tr>
                <td><label for="Name">Name</label><br>
                    <input type="text" name="Name" id="Name">
                </td>
            </tr>

            <tr>
                <td><label for="Number">Telephone Number</label> <br>
                    <input type="text" name="Number" id="Number">
                </td>
            </tr>
            <tr>
                <td><label for="Email">Email</label><br>
                    <input type="text" name="Email" id="Email">
                </td>
            </tr>
            <tr>
                <td><label for="Color">Favorite Color</label><br>
                    <input type="color" name="color" id="Color" value="#0000FF">
                </td>
            </tr>
            <tr>
                <td><label for="Date">Date</label><br>
                    <input type="date" name="Date" id="Date">
                </td>
            </tr>
        </table>
        <input type="button" value="Submit">
    </form>
</body>

</html>

</html>
