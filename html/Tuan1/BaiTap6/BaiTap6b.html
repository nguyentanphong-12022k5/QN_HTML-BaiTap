<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            border: 1px solid black;
        }
    </style>
</head>

<body>
    <h1>Contact Us</h1>
    <fieldset>
        <legend>Your message:</legend>
        <table>
            <tr>
                <td><label for="To">To:</label></td>
                <td><input type="text" name="To" id="To" placeholder="Example Cafe"></td>
            </tr>
            <tr>
                <td><label for="Email">Your Email:</label></td>
                <td><input type="text" name="Email" id="Email"></td>
            </tr>
            <tr>
                <td><label for="message">Message:</label></td>
                <td><textarea name="message" id="message" rows="10" cols="50"></textarea></td>
            </tr>
            <tr>
                <td>Attach File</td>
                <td><input type="file" name="Chosefile" accept="image/*"></td>
            </tr>
        </table>
    </fieldset>
    <br>
    <fieldset>
        <legend>How you found us:</legend>
        <table>
            <tr>
                <td>How did you hear of us</td>
                <td>
                    <select name="us" id="us">
                        <option value="google">Google</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="Newsletter">Newsletter</label></td>
                <td><input type="checkbox" name="Newsletter" id="Newsletter" checked="checked">Ensure this box is checked if you would like to receive email updates</td>
            </tr>
        </table>
    </fieldset>
    <input type="button" value="Send message">
</body>

</html>
