<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Thêm chút kiểu dáng cho dễ nhìn */
        
        .image-container {
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <!-- Liên kết tới hình ảnh -->
    <div class="image-container">
        <a href="#image2">
            <img src="https://via.placeholder.com/150" alt="Click to go to image 2">
            <p>Click to see image 2</p>
        </a>
    </div>

    <!-- Hình ảnh đầu tiên -->
    <div class="image-container" id="image1">
        <img src="https://via.placeholder.com/150" alt="Image 1">
    </div>

    <!-- Hình ảnh thứ hai (nơi bạn sẽ đến khi nhấp vào liên kết) -->
    <div class="image-container" id="image2">
        <img src="https://via.placeholder.com/200" alt="Image 2">
    </div>

</body>

</html>
