<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lật Thẻ (Hover)</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        
        .card-container {
            width: 200px;
            height: 300px;
            perspective: 1000px;
            /* Tạo chiều sâu 3D */
        }
        
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            /* Hiệu ứng chuyển đổi */
        }
        
        .card-container:hover .card {
            transform: rotateY(180deg);
            /* Lật thẻ khi hover */
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            /* Ẩn mặt sau */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            border-radius: 10px;
        }
        
        .card-front {
            background-color: #007BFF;
        }
        
        .card-back {
            background-color: #FF5733;
            transform: rotateY(180deg);
            /* Đặt mặt sau xoay 180 độ */
        }
    </style>
</head>

<body>
    <div class="card-container">
        <div class="card">
            <div class="card-face card-front">Mặt Trước</div>
            <div class="card-face card-back">Mặt Sau</div>
        </div>
    </div>
</body>

</html>
